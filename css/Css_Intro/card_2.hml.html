<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Css Introduction</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="card-container">
            <div class="card">
                <img class="card_img card-logo-img" src="wave-hand.jpg"  alt="Welcome">
                <h1>Welcome Amy!</h1>
                <p>It's great to have you with us! to help us <br>
                            optimize your experience, tell us how you<br>
                            plan to use OpenPhone.</p>
                <div class="card_content">
                    <div  class="life_balance">
                        <img src="brief_case.png" alt="Work">
                        <span>Work</span>
                        <img src="arrow.jpg" alt="Work" class="arrow">

                    </div>
                    <div  class="life_balance life_balance_personal">
                        <img src="personal.png" alt="Personal">
                        <span>Personal</span>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
